name: Personal Minecraft 1.19.1 with built-in JIT
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '8'
      - name: Install build dependencies
        run: brew install cmake make ldid xcodegen
      - name: Build experimental IPA
        run: bash build-personal.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Amethyst-1.19.1-BuiltinJIT-experimental
          path: artifacts/Amethyst-1.19.1-BuiltinJIT-experimental.ipa
          if-no-files-found: error
